<footer class="bg-[#02122c] text-gray-300 pt-16 pb-12 border-t border-slate-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Top Footer: Region Button & Links Grid -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-8 pb-12 border-b border-slate-800/80 text-xs">
      
      <!-- Left: Region / Currency Pill Button -->
      <div class="md:col-span-4 space-y-3">
        <button class="min-h-[44px] flex items-center space-x-2 px-4 py-2.5 rounded-lg border border-slate-700 bg-[#072044] hover:bg-[#0c2f60] text-xs font-semibold text-white transition-colors">
          <span>United States · English (US) · {{ currencyService.selectedCurrency().symbol }} {{ currencyService.selectedCurrency().code }}</span>
        </button>
        <p class="text-xs text-gray-300">AI-powered travel &amp; flight search</p>
      </div>

      <!-- Column 1: Explore Shortcuts & Source -->
      <div class="md:col-span-2 space-y-2">
        <p><button type="button" (click)="onNavigate('ai', $event)" class="min-h-[44px] inline-flex items-center font-semibold text-gray-200 hover:text-white transition-colors cursor-pointer">Trip Planner</button></p>
        <p><button type="button" (click)="onNavigate('flights', $event)" class="min-h-[44px] inline-flex items-center font-semibold text-gray-200 hover:text-white transition-colors cursor-pointer">Flights</button></p>
        <p><button type="button" (click)="onNavigate('hotels', $event)" class="min-h-[44px] inline-flex items-center font-semibold text-gray-200 hover:text-white transition-colors cursor-pointer">Stays</button></p>
      </div>

      <!-- Column 2: Policy & Repository -->
      <div class="md:col-span-3 space-y-2">
        <p><button type="button" (click)="onNavigate('cars', $event)" class="min-h-[44px] inline-flex items-center font-semibold text-gray-200 hover:text-white transition-colors cursor-pointer">Car Hire</button></p>
        <p><button type="button" (click)="onNavigate('explore', $event)" class="min-h-[44px] inline-flex items-center font-semibold text-gray-200 hover:text-white transition-colors cursor-pointer">Explore Everywhere</button></p>
        <p><a href="https://github.com/mathurkartik/skyscanner-AI" target="_blank" rel="noopener noreferrer" class="min-h-[44px] inline-flex items-center gap-1.5 font-semibold text-gray-200 hover:text-white transition-colors"><span>GitHub Repository</span></a></p>
      </div>

      <!-- Column 3: Explore & Company Interactive Dropdowns (AG-112) -->
      <div class="md:col-span-3 space-y-1">
        <div>
          <button (click)="toggleSection('explore')" class="w-full min-h-[44px] flex items-center justify-between font-semibold text-gray-200 hover:text-white cursor-pointer py-1 text-left">
            <span>Explore</span>
            <svg class="w-4 h-4 text-gray-300 transition-transform duration-200" [class.rotate-180]="isExpanded('explore')" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          @if (isExpanded('explore')) {
            <div class="pl-2 pt-1 pb-2 space-y-1 text-gray-300 text-xs">
              <p><button type="button" (click)="onNavigate('flights', $event)" class="min-h-[44px] inline-flex items-center hover:text-white transition-colors cursor-pointer">Flights</button></p>
              <p><button type="button" (click)="onNavigate('hotels', $event)" class="min-h-[44px] inline-flex items-center hover:text-white transition-colors cursor-pointer">Hotels</button></p>
              <p><button type="button" (click)="onNavigate('cars', $event)" class="min-h-[44px] inline-flex items-center hover:text-white transition-colors cursor-pointer">Car Hire</button></p>
              <p><button type="button" (click)="onNavigate('explore', $event)" class="min-h-[44px] inline-flex items-center hover:text-white transition-colors cursor-pointer">Explore Everywhere</button></p>
            </div>
          }
        </div>

        <div>
          <button (click)="toggleSection('trips')" class="w-full min-h-[44px] flex items-center justify-between font-semibold text-gray-200 hover:text-white cursor-pointer py-1 text-left">
            <span>Trips</span>
            <svg class="w-4 h-4 text-gray-300 transition-transform duration-200" [class.rotate-180]="isExpanded('trips')" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          @if (isExpanded('trips')) {
            <div class="pl-2 pt-1 pb-2 space-y-1 text-gray-300 text-xs">
              <p><button type="button" (click)="onNavigate('ai', $event)" class="min-h-[44px] inline-flex items-center hover:text-white transition-colors cursor-pointer">AI Trip Planner</button></p>
              <p><button type="button" (click)="onNavigate('flights', $event)" class="min-h-[44px] inline-flex items-center hover:text-white transition-colors cursor-pointer">Flight Search</button></p>
            </div>
          }
        </div>
      </div>

    </div>

    <!-- Bottom Center Slogan & Copyright (AG-103) -->
    <div class="pt-8 text-center text-xs text-gray-300 space-y-1">
      <p class="font-medium text-gray-200">Compare and book cheap flights from anywhere, to everywhere</p>
      <p>© Skyscanner Ltd 2002 – {{ currentYear }}</p>
    </div>

  </div>
</footer>
